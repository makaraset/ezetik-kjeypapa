# TLS termination in front of the Kjey PAPA API.
#
# Two defaults here would break the application silently if left alone, and
# both are raised deliberately below: the request body limit and the read
# timeout. Notes at each.

upstream kjeypapa_api {
    server api:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name kjey-papa.samatfinance.com.kh kjey-papa.sambatfinance.com.kh _;

    # Health checks may arrive on 80; everything else goes to TLS.
    location = /api/v1/pdl/dictionary/version {
        proxy_pass http://kjeypapa_api;
        proxy_set_header Host $host;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name kjey-papa.samatfinance.com.kh kjey-papa.sambatfinance.com.kh _;

    ssl_certificate     /etc/nginx/certs/kjeypapa.crt;
    ssl_certificate_key /etc/nginx/certs/kjeypapa.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # A signup bundle carries five documents inline as base64. nginx defaults to
    # 1 MB, which would reject every account request with a 413 that never
    # reaches the application logs. Sambat's own gateway limit is 50 MB.
    client_max_body_size 64m;
    client_body_timeout  180s;

    # Filing an application with Sambat can take up to los.submit.timeout-seconds
    # (120s). nginx defaults to 60s, which would cut the connection mid-submit —
    # producing exactly the unknown-outcome case the reconciliation code exists
    # to handle, on every slow filing rather than the rare one.
    proxy_read_timeout    180s;
    proxy_send_timeout    180s;
    proxy_connect_timeout 15s;

    location / {
        proxy_pass http://kjeypapa_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The application reads the RIGHT-MOST entry — the hop this proxy
        # appended. See ClientAddress and the note in the runbook about what
        # that means once SBF's gateway is also in the chain.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    access_log /var/log/nginx/kjeypapa.access.log;
    error_log  /var/log/nginx/kjeypapa.error.log warn;
}
