# =============================================================================
# Committed config template — contains NO secrets.
# Secret values are supplied by environment variables (prod) or by a gitignored
# application-local.properties under the `local` profile (dev).
# See README.md > "Configuration & Secrets". Never put real secrets here.
# =============================================================================

spring.sql.init.platform=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.username=${DB_USERNAME}
#spring.datasource.hikari.jdbc-url=jdbc:postgresql://127.0.0.1:5432/kjey_papa_db
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/kjey_papa_db
#spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database=postgresql
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql = true
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.date-format=dd-MM-yyyy
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

springdoc.swagger-ui.tags-sorter=alpha

gcp.firebase.service-account=${FIREBASE_CREDENTIALS_PATH:classpath:firebase-service-account.json}

#Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.boot.admin.notify.mail.to=${ADMIN_NOTIFY_EMAIL}

#SBF Security Endpoint
token_endpoint=https://tricube-uat.sambatfinance.com:4443/oauth/token
urlencoded_token=grant_type=password&username=${SBF_USERNAME}&password=${SBF_PASSWORD}&scope=read%20write%20app%20accountinfo%20repayment%20register
urlencoded_refesh_token=grant_type=refresh_token&refresh_token=
authorization=Basic ${SBF_BASIC_AUTH_BASE64}

#SBF API
url_api=https://tricube-uat.sambatfinance.com:6443/api
urlencoded_facility=/group-facilities/by-cid?custKeyNum=
url_create_loan_fac=/saveLoanFacilities
url_disburse=/auto-disburse
url_merchant=/merchant
url_merchant_cif=/merchant/by-cid?custKeyNum=
url_merchant_code=/merchant/bycode?mercCode=
url_non_working_day=/non-business-day

url_sms=/sendmessgae

#Sambat LOS (TurnKey Lender) — PDL decisioning. Contract TBD per BRS Appendices 1-6.
#While mock is enabled, LosProviderImpl returns canned results so the full
#app<->backend PDL flow works without a live LOS. Set to false once wired.
los.mock.enabled=true

# NID OCR at signup screen 5. SBF's CamDigi OCR at POST /ocr-id-card went
# LIVE on 2026-08-27 (UAT verified end-to-end against a real card, ~3s) after
# the cert fix on their side, so we call it for real. The mock — sample-card
# data, no network — stays available for offline/demo runs; the CIF lookup
# (/customer-information/by-idno) is live either way.
ocr.mock.enabled=false
los.token_endpoint=${LOS_TOKEN_ENDPOINT:}
los.url_api=${LOS_URL_API:}
los.username=${LOS_USERNAME:}
los.password=${LOS_PASSWORD:}
los.webhook.secret=${LOS_WEBHOOK_SECRET:}

#PDL e-contract acceptance cut-off + reminders (V21). Disable if LOS owns the cut-off.
pdl.acceptance.scheduler.enabled=true
pdl.acceptance.reminder-cron=0 0/30 8-17 * * *
pdl.acceptance.cutoff-cron=0 0 17 * * *
pdl.acceptance.grace-minutes=0
# Timezone the cron fire-times are interpreted in. Sambat 2026-08-13 (QB3.4): 5:00 PM Asia/Phnom_Penh, NO grace.
pdl.acceptance.timezone=Asia/Phnom_Penh

# PDL pricing (Sambat 2026-08-13 QC1.3/QC1.6 — we own the quote; every value replaceable here).
# Interest is monthly, PRO-RATED by loan period (reproduces the confirmed $50/15d -> $49.63/$0.37/$45.63).
pdl.pricing.monthly-interest-percent=1.5
pdl.pricing.processing-fee=3.0
pdl.pricing.cbc-fee=1.0
pdl.pricing.period-days=15
pdl.pricing.disbursement-offset-days=1
pdl.pricing.max-amount.payday=50.0
# Tier lists = our Phase-6 proposal (QC1.2), pending Sambat confirmation. KHR indicative ~4,100/USD.
pdl.pricing.tiers.usd=10,20,30,40,50
pdl.pricing.tiers.khr=40000,80000,120000,160000,200000
pdl.pricing.khr-per-usd=4100
# CBC consent record (QC4.2/QC4.3) — interim V8 English text ships in code; version bumps when Sambat sends final EN+KM.
pdl.cbc.text-version=v1-2026-08
# V21 bank-app disbursement-consent hand-off (Q4). Off until the deep-link + callback contract is confirmed; the /pdl/los/bank-verification endpoint no-ops while false.
# ENABLED for the sample-bank-app flow (Sambat QB1.1: sample now, real later).
pdl.bank-verification.enabled=true
# Settlement balance (G20/QC3.1 CLOSED 2026-08-26): LIVE from SBF core via
# /customer-balance + /saving-info-by-cid (TFF-benchmarked). mock=true is the
# kill-switch if SBF misbehaves; mock-balance only used while mocked.
pdl.settlement.mock=false
pdl.settlement.mock-balance=10.0
# Inbound LOS-webhook auth (Q5.2). Off for sandbox; enable once Sambat provisions the secret + source IPs. Leave a check's value empty to skip it.
pdl.webhook.auth.enabled=false
pdl.webhook.secret=
pdl.webhook.secret-header=X-LOS-Signature
pdl.webhook.allowed-ips=

#jwt
security.jwt.secret-key=${JWT_SECRET_KEY}


#api doc
#springdoc.api-docs.enabled=true
#springdoc.api-docs.path=/rest-api-docs
#springdoc.swagger-ui.path=/swagger-ui

spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
